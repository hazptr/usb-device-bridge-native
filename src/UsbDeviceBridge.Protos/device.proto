syntax = "proto3";

package usbdevicebridge.v1;

service DeviceService {
  rpc GetVersionInfo(GetVersionInfoRequest) returns (VersionInfo);
  rpc WatchHeartbeat(HeartbeatRequest) returns (stream HeartbeatEvent);
}

message GetVersionInfoRequest {}

message VersionInfo {
  string frontend_version = 1;
  string service_version = 2;
  string wsl_version = 3;
  string usbipd_version = 4;
}

message HeartbeatRequest {
  // Optional interval hint from client in milliseconds.
  // Service clamps this value to a safe range.
  uint32 interval_ms = 1;
}

message HeartbeatEvent {
  uint64 sequence = 1;
  int64 utc_unix_ms = 2;
}

message Device {
  string instance_id = 1;
  string bus_id = 2;
  string description = 3;
  string hardware_id = 4;
  string state = 5;
  bool remembered = 6;
  string preferred_distro = 7;
  bool attaching = 8;
}
