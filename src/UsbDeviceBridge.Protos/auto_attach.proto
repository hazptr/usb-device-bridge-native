syntax = "proto3";

package usbdevicebridge.v1;

service AutoAttachService {
  rpc RememberDevice(RememberDeviceRequest) returns (RememberDeviceResponse);
  rpc ForgetDevice(ForgetDeviceRequest) returns (ForgetDeviceResponse);
  rpc GetRememberedDevices(GetRememberedDevicesRequest) returns (GetRememberedDevicesResponse);
}

message RememberDeviceRequest {
  string instance_id = 1;
  string preferred_distro = 2;
}

message RememberDeviceResponse {
  bool ok = 1;
  string message = 2;
}

message ForgetDeviceRequest {
  string instance_id = 1;
}

message ForgetDeviceResponse {
  bool ok = 1;
  string message = 2;
}

message GetRememberedDevicesRequest {}

message RememberedDevice {
  string instance_id = 1;
  string preferred_distro = 2;
}

message GetRememberedDevicesResponse {
  repeated RememberedDevice devices = 1;
}
