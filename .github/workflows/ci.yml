name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore UsbDeviceBridgeNative.slnx

      - name: Build (Service)
        run: dotnet build src/UsbDeviceBridge.Service/UsbDeviceBridge.Service.csproj -c Release --no-restore

      - name: Build (App)
        run: dotnet build src/UsbDeviceBridge.App/UsbDeviceBridge.App.csproj -c Release --no-restore

      - name: Build (Tests)
        run: dotnet build src/UsbDeviceBridge.Tests/UsbDeviceBridge.Tests.csproj -c Release --no-restore

      - name: Run Tests
        run: >
          dotnet test src/UsbDeviceBridge.Tests/UsbDeviceBridge.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          if-no-files-found: ignore
