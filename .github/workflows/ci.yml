name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore UsbDeviceBridgeNative.slnx

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $v = & ./scripts/Get-Version.ps1
          "ASSEMBLY_VERSION=$($v.AssemblyVersion)" >> $env:GITHUB_OUTPUT
          "INFORMATIONAL_VERSION=$($v.InformationalVersion)" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $($v.AssemblyVersion)  Informational: $($v.InformationalVersion)"

      - name: Build (Service)
        run: >
          dotnet build src/UsbDeviceBridge.Service/UsbDeviceBridge.Service.csproj
          -c Release --no-restore
          -p:Version=${{ steps.version.outputs.ASSEMBLY_VERSION }}
          -p:InformationalVersion=${{ steps.version.outputs.INFORMATIONAL_VERSION }}

      - name: Build (App)
        run: >
          dotnet build src/UsbDeviceBridge.App/UsbDeviceBridge.App.csproj
          -c Release --no-restore
          -p:Version=${{ steps.version.outputs.ASSEMBLY_VERSION }}
          -p:InformationalVersion=${{ steps.version.outputs.INFORMATIONAL_VERSION }}

      - name: Build (Tests)
        run: dotnet build src/UsbDeviceBridge.Tests/UsbDeviceBridge.Tests.csproj -c Release --no-restore

      - name: Run Tests
        timeout-minutes: 15
        shell: pwsh
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          Write-Host "Starting test run at $(Get-Date -Format o)"
          dotnet test src/UsbDeviceBridge.Tests/UsbDeviceBridge.Tests.csproj `
            -c Release `
            --no-build `
            --filter "FullyQualifiedName!~SetupServiceImplTests" `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory ./test-results `
            --blame-hang `
            --blame-hang-timeout 5m `
            --diag ./test-results/dotnet-test-diag.log
          $exitCode = $LASTEXITCODE
          $stopwatch.Stop()
          Write-Host "Test run finished in $([Math]::Round($stopwatch.Elapsed.TotalSeconds, 2)) seconds with exit code $exitCode"
          exit $exitCode

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./test-results/*.trx
            ./test-results/*.log
            ./test-results/**/*Sequence*.xml
          if-no-files-found: ignore
