name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore UsbDeviceBridgeNative.slnx

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $v = & ./scripts/Get-Version.ps1
          "ASSEMBLY_VERSION=$($v.AssemblyVersion)" >> $env:GITHUB_OUTPUT
          "INFORMATIONAL_VERSION=$($v.InformationalVersion)" >> $env:GITHUB_OUTPUT
          "PACKAGE_VERSION=$($v.PackageVersion)" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $($v.AssemblyVersion)  Informational: $($v.InformationalVersion)"

      - name: Run Tests
        timeout-minutes: 15
        shell: pwsh
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          Write-Host "Starting release-gate tests at $(Get-Date -Format o)"
          dotnet test src/UsbDeviceBridge.Tests/UsbDeviceBridge.Tests.csproj `
            -c Release `
            --no-restore `
            --filter "FullyQualifiedName!~SetupServiceImplTests" `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory ./test-results `
            --blame-hang `
            --blame-hang-timeout 5m `
            --diag ./test-results/dotnet-test-diag.log
          $exitCode = $LASTEXITCODE
          $stopwatch.Stop()
          Write-Host "Release-gate tests finished in $([Math]::Round($stopwatch.Elapsed.TotalSeconds, 2)) seconds with exit code $exitCode"
          exit $exitCode

      - name: Upload Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            ./test-results/*.trx
            ./test-results/*.log
            ./test-results/**/*Sequence*.xml
          if-no-files-found: ignore

      - name: Publish Service
        run: >
          dotnet publish src/UsbDeviceBridge.Service/UsbDeviceBridge.Service.csproj
          -c Release
          -r win-x64
          -p:SelfContained=false
          -p:Version=${{ steps.version.outputs.ASSEMBLY_VERSION }}
          -p:InformationalVersion=${{ steps.version.outputs.INFORMATIONAL_VERSION }}

      - name: Publish App
        run: >
          dotnet publish src/UsbDeviceBridge.App/UsbDeviceBridge.App.csproj
          -c Release
          -r win-x64
          -p:SelfContained=false
          -p:Version=${{ steps.version.outputs.ASSEMBLY_VERSION }}
          -p:InformationalVersion=${{ steps.version.outputs.INFORMATIONAL_VERSION }}

      - name: Build Installer
        run: >
          dotnet build src/UsbDeviceBridge.Installer/UsbDeviceBridge.Installer.wixproj
          -c Release
          --no-restore
          -p:PackageVersion=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Compute checksum
        id: checksum
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Filter "*.msi" src/UsbDeviceBridge.Installer/bin | Select-Object -First 1
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
          echo "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  $($msi.Name)" | Set-Content "$($msi.DirectoryName)\$($msi.BaseName).sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.ASSEMBLY_VERSION }}
          path: |
            ${{ steps.checksum.outputs.MSI_PATH }}
            src/UsbDeviceBridge.Installer/bin/**/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.ASSEMBLY_VERSION }}
          generate_release_notes: true
          files: |
            ${{ steps.checksum.outputs.MSI_PATH }}
            src/UsbDeviceBridge.Installer/bin/**/*.sha256
