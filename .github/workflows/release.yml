name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore UsbDeviceBridgeNative.slnx

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Run Tests
        run: >
          dotnet test src/UsbDeviceBridge.Tests/UsbDeviceBridge.Tests.csproj
          -c Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Publish Service
        run: >
          dotnet publish src/UsbDeviceBridge.Service/UsbDeviceBridge.Service.csproj
          -c Release
          -r win-x64
          -p:SelfContained=false
          -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Publish App
        run: >
          dotnet publish src/UsbDeviceBridge.App/UsbDeviceBridge.App.csproj
          -c Release
          -r win-x64
          -p:SelfContained=false
          -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Build Installer
        run: >
          dotnet build src/UsbDeviceBridge.Installer/UsbDeviceBridge.Installer.wixproj
          -c Release
          --no-restore

      - name: Compute checksum
        id: checksum
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Filter "*.msi" src/UsbDeviceBridge.Installer/bin | Select-Object -First 1
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
          echo "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  $($msi.Name)" | Set-Content "$($msi.DirectoryName)\$($msi.BaseName).sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.VERSION }}
          path: |
            ${{ steps.checksum.outputs.MSI_PATH }}
            src/UsbDeviceBridge.Installer/bin/**/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ${{ steps.checksum.outputs.MSI_PATH }}
            src/UsbDeviceBridge.Installer/bin/**/*.sha256
